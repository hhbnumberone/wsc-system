<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湿喷台车车载终端</title>
<link rel="stylesheet" href="style.css?v=1103">
</head>
<body data-page="index">

<!-- 状态栏、导航、横幅由 app.js 挂载（六个页面共用，见 mountChrome） -->
<div id="chrome"></div>

<div class="wrap" style="grid-template-columns:minmax(420px,1.1fr) minmax(420px,1fr)">

  <!-- ===================== 左：实时参数 ===================== -->
  <div class="card">
    <h2><span class="ttl">监测实时数据</span> <span class="spacer"></span>
      <span id="sampleinfo" style="font-weight:400"></span>
    </h2>
    <div class="body" id="params">
      <div class="note">正在采集…</div>
    </div>
  </div>

  <!-- ===================== 右：实时曲线 ===================== -->
  <div class="card">
    <h2><span class="ttl">实时曲线</span> <span class="spacer"></span>
      <span id="charttitle" style="font-weight:400">泵送压力</span>
    </h2>
    <div class="body">
      <canvas id="chart" width="760" height="226"></canvas>
      <div class="legend">
        <span><i style="background:#4da3ff"></i>实测值</span>
        <span><i style="background:#ff6b7a"></i>上限</span>
        <span><i style="background:#ffb454"></i>下限</span>
        <span id="chartstat"></span>
      </div>
      <div class="note">点击左侧任一参数名即可切换曲线；曲线读自本地库原始记录，
        <b>断网时仍在更新</b>。</div>
    </div>
  </div>
</div>

<script src="app.js?v=1103"></script>
</body>
</html>
