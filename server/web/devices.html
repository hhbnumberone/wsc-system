<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备与传输 — 耿力大数据平台</title>
<link rel="stylesheet" href="style.css?v=1103">
</head>
<body data-page="devices">

<div class="topbar">
  <div class="brand">耿力大数据平台<small>设备与传输</small></div>
  <div class="spacer"></div>
  <button id="btn-shutdown" class="shutdown">关闭系统</button>
  <div class="meta">
    <div id="site">—</div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div class="frame">
    <aside class="side">
    <div class="side-grp">实时监测</div>
    <a href="/" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-12h8V3h-8v6z"/></svg><span>运行总览</span></a>
    <a href="/alarms.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6v-5a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg><span>报警与循环</span></a>
    <div class="side-grp">历史查询</div>
    <a href="/history.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>历史数据</span></a>
    <a href="/frames.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3zm2 2v4h14V5H5zm0 6v4h14v-4H5zm0 6v2h14v-2H5z"/></svg><span>原始记录</span></a>
    <div class="side-grp">传输审计</div>
    <a href="/devices.html" class=" on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v4H4zm0 8h16v4H4zm-2-9h2v2H2zm0 8h2v2H2zm18 8h2v2h-2zM2 21h16v2H2z"/></svg><span>传输监控</span></a>
    <a href="/audit.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg><span>审计与拒收</span></a>
  </aside>

<main>
  <div id="banner" class="banner hidden"></div>

  <div class="row cols-4">
    <div class="card kpi" id="d-dev"><div class="k">设备</div><div class="v">—</div><div class="s">在线判定看心跳新鲜度，不看状态字段</div></div>
    <div class="card kpi accent"><div class="k">接收批次</div><div class="v" id="d-batch">—</div><div class="s">同一批次重复上送只入库一次</div></div>
    <div class="card kpi warn"><div class="k">终端欠传</div><div class="v" id="d-backlog">—</div><div class="s">设备本地还没传上来的记录数</div></div>
    <div class="card kpi bad"><div class="k">被拒收</div><div class="v" id="d-reject">—</div><div class="s">按原因分类，见下表</div></div>
  </div>

  <div class="card mt grow" style="flex:1.1">
    <h2>设备清单</h2>
    <div class="body tight">
      <table class="grid">
        <thead><tr>
          <th>设备</th><th>状态</th><th>最后心跳</th><th>链路</th>
          <th class="num">欠传</th><th>工区</th><th>说明</th>
        </tr></thead>
        <tbody id="devices"></tbody>
      </table>
    </div>
  </div>

  <div class="card mt grow">
    <h2>上传批次 <span class="spacer"></span><span class="note" id="b-stat"></span></h2>
    <div class="body tight">
      <div class="scroll">
        <table class="grid">
          <thead><tr>
            <th>平台收妥时间</th><th>批次号</th><th>类型</th>
            <th class="num">条数</th><th class="num">接受</th><th class="num">重复</th>
            <th class="num">拒收</th>
          </tr></thead>
          <tbody id="batches"></tbody>
        </table>
      </div>
      <p class="note" style="padding:10px 14px 14px">
        批次号是<strong>内容寻址</strong>的：<code>sha1(排序后的 record_id 前 16 位)</code>。
        同一批数据重发时批次号不变，平台返回上一份回执并标 <span class="tag dim">重复</span> ——
        这就是"断网重连后怎么补都不会重"的机制。
      </p>
    </div>
  </div>
</main>
</div>

<script src="app.js?v=1103"></script>
</body>
</html>
