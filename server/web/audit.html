<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审计与拒收 — 耿力大数据平台</title>
<link rel="stylesheet" href="style.css?v=1103">
</head>
<body data-page="audit">

<div class="topbar">
  <div class="brand">耿力大数据平台</div>
  <div class="spacer"></div>
  <button id="btn-shutdown" class="shutdown">关闭系统</button>
  <div class="meta">
    <div id="site">—</div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div class="frame">
  <aside class="side">
    <div class="side-grp">实时监测</div>
    <a href="/" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-12h8V3h-8v6z"/></svg><span>运行总览</span></a>
    <a href="/alarms.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6v-5a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg><span>报警与循环</span></a>
    <div class="side-grp">历史查询</div>
    <a href="/history.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>历史数据</span></a>
    <a href="/frames.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3zm2 2v4h14V5H5zm0 6v4h14v-4H5zm0 6v2h14v-2H5z"/></svg><span>原始记录</span></a>
    <div class="side-grp">传输审计</div>
    <a href="/devices.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v4H4zm0 8h16v4H4zm-2-9h2v2H2zm0 8h2v2H2zm18 8h2v2h-2zM2 21h16v2H2z"/></svg><span>传输监控</span></a>
    <a href="/audit.html" class=" on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg><span>审计与拒收</span></a>
  </aside>
<main>
  <div id="banner" class="banner hidden"></div>

  <div class="card kpi bad"><div class="k">被拒收</div><div class="v" id="d-reject">—</div><div class="s">按原因分类，见下表</div></div>

  <div class="row cols-2 mt grow">
    <div class="card">
      <h2>拒收明细 <span class="spacer"></span><span class="note" id="r-stat"></span></h2>
      <div class="body tight">
        <div class="scroll">
          <table class="grid">
            <thead><tr>
              <th>时间</th><th>记录</th><th>原因</th><th>说明</th>
            </tr></thead>
            <tbody id="rejects"></tbody>
          </table>
        </div>
        <p class="note" style="padding:10px 14px 14px">
          最常见的拒收原因是 <code>PILE_NOT_ISSUED</code>：记录里的桩号不在平台下发的清单里。
          平台侧<strong>入库前再校验一次</strong>桩号，是桩号防伪的最后一层。
        </p>
      </div>
    </div>

    <div class="card">
      <h2>操作留痕（审计事件） <span class="spacer"></span><span class="note" id="a-stat"></span></h2>
      <div class="body tight">
        <div class="scroll">
          <table class="grid">
            <thead><tr>
              <th>设备时间</th><th>平台收到</th><th>事件</th><th>内容</th>
            </tr></thead>
            <tbody id="audit"></tbody>
          </table>
        </div>
        <p class="note" style="padding:10px 14px 14px">
          切换桩号、手动补传、U 盘导出/导入、数据修订都作为独立事件上传，
          <strong>即使数据本体还没传上来也照样留痕</strong>。
        </p>
      </div>
    </div>
  </div>

</main>
</div>

<script src="app.js?v=1103"></script>
</body>
</html>
