<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原始记录 — 耿力大数据平台</title>
<link rel="stylesheet" href="style.css?v=1103">
</head>
<body data-page="frames">

<div class="topbar">
  <div class="brand">耿力大数据平台</div>
  <div class="spacer"></div>
  <button id="btn-shutdown" class="shutdown">关闭系统</button>
  <div class="meta">
    <div id="site">—</div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div class="frame">
  <aside class="side">
    <div class="side-grp">实时监测</div>
    <a href="/" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-12h8V3h-8v6z"/></svg><span>运行总览</span></a>
    <a href="/alarms.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6v-5a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg><span>报警与循环</span></a>
    <div class="side-grp">历史查询</div>
    <a href="/history.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>历史数据</span></a>
    <a href="/frames.html" class=" on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3zm2 2v4h14V5H5zm0 6v4h14v-4H5zm0 6v2h14v-2H5z"/></svg><span>原始记录</span></a>
    <div class="side-grp">传输审计</div>
    <a href="/devices.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v4H4zm0 8h16v4H4zm-2-9h2v2H2zm0 8h2v2H2zm18 8h2v2h-2zM2 21h16v2H2z"/></svg><span>传输监控</span></a>
    <a href="/audit.html" class=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg><span>审计与拒收</span></a>
  </aside>
<main>
  <div id="banner" class="banner hidden"></div>
  <div class="card mt grow">
    <h2>原始记录 <span class="spacer"></span>
      <span class="ctrl">
        <span class="note" id="f-stat"></span>
        <a id="export" href="#" style="color:var(--accent);font-size:13px">导出 CSV</a>
      </span>
    </h2>
    <div class="body tight">
      <div class="scroll">
        <table class="grid">
          <thead><tr>
            <th>时间</th><th>桩号</th><th class="num">泵送压力<br><span style="font-weight:400">MPa</span></th>
            <th class="num">泵送速度<br><span style="font-weight:400">m³/h</span></th>
            <th class="num">速凝剂添加速度<br><span style="font-weight:400">L/h</span></th>
            <th class="num">速凝剂累计用量<br><span style="font-weight:400">L</span></th>
            <th>来源</th><th>数据状态</th><th></th>
          </tr></thead>
          <tbody id="frames"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</div>

<script src="app.js?v=1103"></script>
</body>
</html>
